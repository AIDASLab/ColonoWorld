# Synthetic whole-colon shapes for full-procedure generation (cecum -> rectum withdrawal).
# Built by colonoworld.tube.colon_anatomy.build_colon_wall; camera replay and rendering by
# colonoworld.tube.synthetic_colon.build_full_colon.
#
# Per shape:
#   course              anatomical control points in cm (body frame: +x patient left, +y superior,
#                       +z anterior), listed from the anus to the cecum for each segment
#   target_length_cm    total length after spline smoothing (anus to cecal pole)
#   smooth_units        Gaussian sigma of the centreline smoothing (pose units, default 0.8)
#   diameter_cm         nominal lumen diameter per segment
#   speed_match         per segment: training-video median of local radius / per-frame step
#   deform              withdrawal deformations: dent, kissing (opposite folds nearly touching),
#                       collapse (partial, one-sided), pleats (sigmoid)
#   wall                seeded free-form wall fields and camera lateral-offset settings
#   wall_zones          optional contraction rings and flattened stretches
#   haustra_depth_gain  optional per-segment gain on semilunar fold depth
#   splenic_semilunar_depth_fraction, rectum_bow_gain   optional course/fold adjustments

base: tube.yaml
include: ../data/realcolon_windows.yaml  # donor-template window manifest (REAL-Colon, CC BY 4.0)

full_colon:
  # Anatomical template (cecal dwell rotations, withdrawal step pattern and fold relief of the
  # reference colon) and the motion library of the training tubes (see docs/full_colon.md).
  motion_library: ${COLONOWORLD_DATA}/full_colon/motion_library.npz
  camera_replay:       # defaults; shapes may override
    camera_replay_seed: 20261111  # RNG seed for the choice of replayed training windows
    view_gain: null    # off-axis gain of the replayed look direction (null = unchanged)
    clearance_target: 0.35  # shrink replayed offsets until the wall is this far (reference radii)
    shrink: 0.7
    passes: 8
    min_clearance: 0.30
  device_field: A      # device-field variant of the synthetic videos
  calibration:         # fisheye calibration used for every synthetic video
    model: KB4_with_native_to_clip_affine
    K_native: [[778.708, 0.0, 681.07], [0.0, 778.708, 546.2], [0.0, 0.0, 1.0]]
    D: [-0.18052383764365731, -0.028882041567681326, 0.04979311339471838, -0.01303850597544803]
    native_to_clip: [[0.8165554133776447, 0.0, -0.02098930085133115], [0.0, 0.8204751168903952, -27.059830266412895], [0.0, 0.0, 1.0]]
    K_clip: [[635.8582328404789, 0.0, 556.1104060882612], [0.0, 638.9105373234859, 421.083678579121], [0.0, 0.0, 1.0]]
    field_radius_px: 721.7
    native_size: [1352, 1080]
    clip_size: [1104, 832]

donor_template: ${COLONOWORLD_DATA}/full_colon/donor_template.npz

