[project]
name = "colonoworld"
version = "1.0.0"
description = "ColonoWorld: Camera-Controlled Full-Procedure Colonoscopy Video Generation"
readme = "README.md"
license = { text = "CC-BY-NC-4.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.10",
    "av>=12.0",
    "pillow>=10.0",
    "torch>=2.6",
    "safetensors>=0.4",
]

[project.optional-dependencies]
render = ["mitsuba>=3.6", "drjit>=1.0"]
tube-fit = ["scikit-image>=0.24", "trimesh>=4.0"]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
include = ["colonoworld*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
